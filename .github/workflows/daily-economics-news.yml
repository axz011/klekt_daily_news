name: Daily Economics News

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # 00:30 UTC = 08:30 Beijing time.
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily economics news
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          # Optional. Leave unset if using the free fallback chain.
          TRANSLATE_API_URL: ${{ secrets.TRANSLATE_API_URL }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}

          # Optional LibreTranslate settings.
          LIBRETRANSLATE_URL: ${{ secrets.LIBRETRANSLATE_URL }}
          LIBRETRANSLATE_API_KEY: ${{ secrets.LIBRETRANSLATE_API_KEY }}

          NEWS_LIMIT: "20"
          SUMMARY_MAX_CHARS: "800"
          TRANSLATION_CHUNK_SIZE: "450"
          TRANSLATION_RETRIES: "2"
          TRANSLATION_DELAY: "0.4"
          RSS_TIMEOUT: "20"
          REQUEST_TIMEOUT: "20"
          LOG_LEVEL: "INFO"
        run: python generate_and_send_economics_github.py
